{{define "app"}}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <meta name="description" content="{{.Description}}">
  <meta name="theme-color" content="#FBF8F5">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/theme.css?v=7">
  <link rel="stylesheet" href="/static/css/style.css?v=10">
  <link rel="stylesheet" href="/static/css/app.css?v=32">
  <style>{{themeCSS .Theme}}</style>
</head>
<body class="app-body">
  {{template "app-sidebar" .}}
  {{template "app-topbar" .}}
  <div class="app-main">
    <main class="app-content" id="main">
      {{template "app-content" .}}
    </main>
  </div>
  <div class="modal" id="invoice-modal" hidden>
    <div class="modal-backdrop" data-invoice-close></div>
    <div class="modal-card modal-card-wide" id="invoice-modal-body"></div>
  </div>
  <script src="/static/js/vendor/htmx.min.js?v=7" defer></script>
  <script src="/static/js/components/core.js?v=7" defer></script>
  <script src="/static/js/components/menu.js?v=7" defer></script>
  <script src="/static/js/components/time24.js?v=1" defer></script>
  <script src="/static/js/components/agenda.js?v=19" defer></script>
  <script src="/static/js/components/theme.js?v=7" defer></script>
  <script src="/static/js/components/invoice.js?v=7" defer></script>
  <script src="/static/js/components/caja.js?v=2" defer></script>
  <script src="/static/js/components/users.js?v=1" defer></script>
  <script src="/static/js/components/autosave.js?v=1" defer></script>
  <script src="/static/js/app.js?v=8" defer></script>
</body>
</html>{{end}}
