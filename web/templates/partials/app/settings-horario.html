{{define "settings-horario-block"}}
<section class="app-section">
  <div class="app-section-head">
    <div>
      <h2>Horario del centro</h2>
      <p class="muted">Define el horario de apertura y marca los días en los que el centro permanece cerrado.</p>
    </div>
  </div>
  <form method="post" action="/app/configuracion/horario" class="schedule-form">
    <div class="schedule-grid">
      {{range .ClinicSchedule}}
      <div class="schedule-row">
        <span class="schedule-day">{{weekdayName .Day}}</span>
        <label>Desde<input type="text" name="open_{{.Day}}" value="{{.Open}}" data-time24 inputmode="numeric" maxlength="5" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" autocomplete="off"></label>
        <label>Hasta<input type="text" name="close_{{.Day}}" value="{{.Close}}" data-time24 inputmode="numeric" maxlength="5" placeholder="HH:MM" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" autocomplete="off"></label>
        <label class="schedule-closed"><input type="checkbox" name="closed_{{.Day}}" value="1"{{if not .Open}} checked{{end}}> Cerrado</label>
      </div>
      {{end}}
    </div>
    <div class="schedule-actions">
      <button class="btn btn-primary" type="submit">Guardar horario</button>
    </div>
  </form>
</section>
{{end}}
